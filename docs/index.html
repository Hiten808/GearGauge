<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gear Gauge - Tech Spec &amp; Gadget Comparison Portal. Compare laptops, phones, tablets and Android TVs side by side. Built with PHP, MySQLi and vanilla JavaScript.">
    <title>Gear Gauge — Tech Spec &amp; Gadget Comparison Portal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --border-color: #334155;
            --text-color: #e2e8f0;
            --muted-color: #94a3b8;
            --accent-color: #38bdf8;
            --accent-soft-color: rgba(56, 189, 248, 0.12);
            --success-color: #34d399;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background:
                radial-gradient(1100px 500px at 85% -10%, rgba(56, 189, 248, 0.09), transparent),
                var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .brand span {
            color: var(--accent-color);
        }

        .nav-links a {
            color: var(--muted-color);
            text-decoration: none;
            font-weight: 600;
            margin-left: 18px;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--accent-color);
        }

        .hero {
            text-align: center;
            padding: 110px 0 60px;
        }

        .hero h1 {
            font-size: 3.4rem;
            line-height: 1.2;
        }

        .hero h1 span {
            color: var(--accent-color);
        }

        .screenshot-frame {
            margin: 50px auto 10px;
            max-width: 900px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(2, 6, 23, 0.55);
        }

        .screenshot-frame img {
            display: block;
            width: 100%;
            height: auto;
        }

        .caption {
            text-align: center;
            color: var(--muted-color);
            font-size: 0.85rem;
            margin-bottom: 50px;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 26px 0;
            text-align: center;
            color: var(--muted-color);
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .hero h1 {
                font-size: 2.1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar container">
            <a class="brand" href="index.html">Gear<span>Gauge</span></a>
            <div class="nav-links">
                <a href="https://github.com/Hiten808/GearGauge">Source Code</a>
                <a href="https://vanilla-dirt-dice-award.trycloudflare.com/GearGauge/">Live Website</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero container">
            <h1>Measure the gear. <span>Trust the gauge.</span></h1>
        </section>
        <section class="container">
            <div class="screenshot-frame">
                <img src="preview.jpeg" alt="Gear Gauge comparison page showing a MacBook Air 13 M3 versus iPhone 15 Pro with winning specifications highlighted in green">
            </div>
            <p class="caption">Side-by-side comparison with automatic winner highlighting — RAM, storage and battery favour higher values, price favours lower.</p>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>GearGauge — Tech Spec &amp; Gadget Comparison Portal</p>
        </div>
    </footer>
</body>
</html>
